<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Change Password | Rally School</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="progress.css"></head>
<body>
  <nav class="progress-nav"><div class="progress-nav-inner"><a class="brand" href="index.html">🎾 Rally School</a><span class="nav-spacer"></span><a class="nav-link" href="progress-login.html">← Sign in</a></div></nav>
  <main class="login-shell"><section class="panel login-card">
    <p class="eyebrow">Account security</p><h1 id="passwordTitle">Reset your password</h1><p id="passwordIntro" class="muted">Enter your authorized email and we&apos;ll send a secure password-reset link.</p>
    <form id="requestResetForm"><div class="form-field"><label for="resetEmail">Authorized email</label><input id="resetEmail" name="email" type="email" autocomplete="email" required></div><div class="button-row" style="margin-top:18px"><button class="button" type="submit">Send reset link</button></div></form>
    <form id="changePasswordForm" class="hidden"><div class="form-field"><label for="newPassword">New password</label><input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="6" required></div><div class="form-field" style="margin-top:14px"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></div><div class="button-row" style="margin-top:18px"><button class="button" type="submit">Update password</button></div></form>
    <p data-status class="status-message" aria-live="polite"></p>
  </section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="progress-config.js"></script><script src="progress-client.js"></script><script src="progress-password.js"></script>
</body></html>
