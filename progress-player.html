<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Player Profile | Rally School</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="progress.css"></head>
<body><nav class="progress-nav"><div class="progress-nav-inner"><a class="brand" href="index.html">🎾 Rally School</a><span class="nav-spacer"></span><a class="nav-link" href="progress.html">← All players</a><button id="signOut" class="ghost-button">Sign out</button></div></nav>
<main class="page-shell"><div class="config-warning">Supabase is not configured. See <strong>PLAYER_PROGRESS_SETUP.md</strong>.</div><header class="page-heading"><div><p class="eyebrow">Player profile</p><h1 id="playerName">Loading…</h1><p id="playerMeta" class="muted"></p></div><div id="coachActions" class="button-row hidden"><button class="button secondary" data-open="playerFormPanel">Edit player</button><button class="button" data-open="assessmentFormPanel">Add assessment</button></div></header><p data-status class="status-message" aria-live="polite"></p>
<section id="profileStats" class="grid two"></section>
<section id="playerFormPanel" class="panel hidden"><h2>Edit player information</h2><form id="editPlayerForm" class="form-grid"></form></section>

<section id="assessmentFormPanel" class="panel hidden">
  <h2>Add assessment</h2>

  <p class="muted">
    Use structured selections for consistent evaluations.
    Notes are optional.
  </p>

  <form id="assessmentForm" class="form-grid">

    <div class="form-field">
      <label>
        Assessment type
        <select name="assessment_mode">
          <option value="new">New assessment</option>
          <option value="correction">Correct previous assessment</option>
        </select>
      </label>
    </div>

    <div class="form-field">
      <label>
        Assessment date
        <input
          name="evaluated_at"
          type="date"
          required
        >
      </label>
    </div>

    <div id="previousAssessmentField" class="form-field hidden">
      <label>
        Previous assessment
        <select name="previous_assessment_id"></select>
      </label>
    </div>



    <div id="originalAssessmentReference"
         class="form-field full hidden"></div>

    <div class="form-field">
      <label>
        Longest rally with coach
        <input name="longest_rally" type="number" min="0" step="1" inputmode="numeric" placeholder="Number of shots">
      </label>
    </div>

    <div class="form-field">
      <label>
        Longest rally with other trainees
        <input name="longest_rally_with_trainees" type="number" min="0" step="1" inputmode="numeric" placeholder="Number of shots">
      </label>
    </div>

    <div class="form-field">
      <label>
        Shape / net clearance
        <select name="shape_net_clearance">
          <option value="">Not measured</option>
          <option value="0">0 · Not demonstrated</option>
          <option value="1">1 · Emerging</option>
          <option value="2">2 · Functional</option>
          <option value="3">3 · Consistent</option>
        </select>
      </label>
    </div>

    <div class="form-field">
      <label>
        Contact / preparation
        <select name="contact_preparation">
          <option value="">Not measured</option>
          <option value="0">0 · Not demonstrated</option>
          <option value="1">1 · Emerging</option>
          <option value="2">2 · Functional</option>
          <option value="3">3 · Consistent</option>
        </select>
      </label>
    </div>

    <div class="form-field">
      <label>
        Movement / recovery
        <select name="movement_recovery">
          <option value="">Not measured</option>
          <option value="0">0 · Not demonstrated</option>
          <option value="1">1 · Emerging</option>
          <option value="2">2 · Functional</option>
          <option value="3">3 · Consistent</option>
        </select>
      </label>
    </div>

    <div class="form-field">
      <label>
        Control / placement
        <select name="control_placement">
          <option value="">Not measured</option>
          <option value="0">0 · Not demonstrated</option>
          <option value="1">1 · Emerging</option>
          <option value="2">2 · Functional</option>
          <option value="3">3 · Consistent</option>
        </select>
      </label>
    </div>

    <div class="form-field full">
      <label>
        Optional note
        <textarea
          name="note"
          placeholder="Optional coach note"
        ></textarea>
      </label>
    </div>

    <div>
      <button class="button" type="submit">
        Append assessment
      </button>
    </div>

  </form>
</section>


<div class="grid two" style="margin-top:18px"><section class="panel"><h2>Assessment progress</h2><div id="assessmentChart"></div></section></div><section class="panel"><h2>Assessment history</h2><div id="assessments" class="list"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="progress-config.js"></script><script src="progress-client.js"></script><script src="progress-player.js"></script></body></html>
