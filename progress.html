<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Player Progress | Rally School</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="progress.css"></head>
<body><nav class="progress-nav"><div class="progress-nav-inner"><a class="brand" href="index.html">🎾 Rally School</a><span class="nav-spacer"></span><span id="roleLabel" class="muted"></span><button id="signOut" class="ghost-button">Sign out</button></div></nav>
<main class="page-shell"><div class="config-warning">Supabase is not configured. See <strong>PLAYER_PROGRESS_SETUP.md</strong>.</div><header class="page-heading"><div><p class="eyebrow">Player development</p><h1 id="pageTitle">Player Progress</h1><p id="pageIntro" class="muted">Loading your assigned players…</p></div><button id="addPlayerButton" class="button hidden">+ Add player</button></header><p data-status class="status-message" aria-live="polite"></p><section id="playerGrid" class="player-grid"></section></main>
<div id="playerModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="playerFormTitle"><section class="modal-card"><header class="modal-header"><h2 id="playerFormTitle">Add player</h2><button class="icon-button" data-close-modal aria-label="Close">×</button></header><form id="playerForm" class="form-grid"><input name="id" type="hidden"><div class="form-field"><label>First name<input name="first_name" required></label></div><div class="form-field"><label>Last name<input name="last_name" required></label></div><div class="form-field"><label>Date of birth<input name="date_of_birth" type="date"></label></div><div class="form-field"><label>Tennis start date<input name="tennis_start_date" type="date"></label></div><div class="form-field"><label>Ball stage<select name="current_ball_stage" required><option value="red">Red</option><option value="orange">Orange</option><option value="green">Green</option><option value="yellow">Yellow</option></select></label></div><div class="form-field"><label>First Rally School training<input name="rally_school_start_date" type="date"></label></div><div class="form-field full"><label>Tennis experience<textarea name="tennis_experience_note"></textarea></label></div><div class="form-field full"><label>Current focus areas (comma-separated)<input name="current_focus_areas"></label></div><div class="form-field"><label>Development stage<input name="current_development_stage"></label></div><div class="form-field"><label>Target stage<input name="target_stage"></label></div><div class="form-field full"><button class="button" type="submit">Save player</button></div></form><p data-form-status class="status-message" aria-live="polite"></p></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="progress-config.js"></script><script src="progress-client.js"></script><script src="progress-dashboard.js"></script></body></html>
